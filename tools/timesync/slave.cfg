#
# Automotive Profile example configuration for clients containing those
# attributes which differ from the defaults.  See the file, default.cfg, for
# the complete list of available options.
#
[global]
# Customized options
# PTP Domain
domainNumber        0       
# 802.1AS-2011 Version
ptp_minor_version   0       
# Disable BMCA
BMCA			noop        
# Slave Only
clientOnly		1           
# No Announce Message
inhibit_announce	1       
# Always asCapable
asCapable           true    
# Not Check source id of sync&fup
ignore_source_id	1       
# Required to quickly correct Time Jumps in master
# step correction if offset > 1ms
step_threshold		0.001       
# step at initial if offset > 10us
first_step_threshold  0.00001 
# offset threshold to enter locked_stable state, unit: ns
servo_offset_threshold	50  
# num of consecutive offset lower than threshold to enter locked stable state
servo_num_offset_values	10  

tx_timestamp_timeout    1000

#
# Options carried over from gPTP.
#
gmCapable		1
priority1		248
priority2		248
logSyncInterval		-3
syncReceiptTimeout	3
neighborPropDelayThresh	800
min_neighbor_prop_delay	-20000000
assume_two_step		1
path_trace_enabled	1
follow_up_info		1
transportSpecific	0x1
ptp_dst_mac		01:80:C2:00:00:0E
network_transport	L2
delay_mechanism		P2P

