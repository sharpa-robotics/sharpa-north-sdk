<circle cx="480" cy="250" r="21" fill="#2563eb"/>
<text x="480" y="258" class="heading" text-anchor="middle" style="fill:white">1</text>
<line x1="548" y1="133" x2="545" y2="226" stroke="#94a3b8" stroke-width="2"/>
<rect x="463" y="81" width="170" height="53" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="548" y="116" class="body" text-anchor="middle">Middle finger</text>
<circle cx="545" cy="226" r="21" fill="#2563eb"/>
<text x="545" y="234" class="heading" text-anchor="middle" style="fill:white">2</text>
<line x1="826" y1="179" x2="610" y2="256" stroke="#94a3b8" stroke-width="2"/>
<rect x="741" y="127" width="170" height="53" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
