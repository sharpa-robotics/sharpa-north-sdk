<line x1="975" y1="416" x2="700" y2="386" stroke="#94a3b8" stroke-width="2"/>
<rect x="890" y="364" width="170" height="53" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="975" y="399" class="body" text-anchor="middle">Thumb</text>
