<text x="700" y="394" class="heading" text-anchor="middle" style="fill:white">4</text>
<text x="600" y="621" class="body" text-anchor="middle">Both hands use the same numbers for the same finger.</text>
<text x="600" y="668" class="code blue" text-anchor="middle">sdk.hand(Side::kLeft).on_tactile_image(4, kind, callback)</text>
