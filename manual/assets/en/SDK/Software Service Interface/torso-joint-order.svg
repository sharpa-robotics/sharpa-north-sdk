<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="405" viewBox="0 0 1200 405" role="img" aria-labelledby="title description">
<title id="title">Torso position array order</title>
<desc id="description">position[0] to [4] are body J1 to J5; position[5] to [7] are neck J6 to J8. Supply eight values in rad.</desc>
<defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
              <marker id="muted-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
            </defs>
            <style>
              text{font-family:"Noto Sans CJK SC",Arial,sans-serif;fill:#1e293b}
              .title{font-size:30px;font-weight:700}.heading{font-size:24px;font-weight:700}
              .body{font-size:22px}.small{font-size:19px}.code{font-family:"DejaVu Sans Mono","Noto Sans CJK SC",monospace;font-size:20px}
              .muted{fill:#475569}.blue{fill:#1d4ed8}.green{fill:#047857}.red{fill:#b91c1c}
            </style>
<rect width="1200" height="405" rx="16" fill="#f8fafc"/>
<text x="36" y="53" class="title" text-anchor="start">Torso position array order</text>
<rect x="36" y="88" width="701" height="48" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
<text x="386" y="121" class="heading blue" text-anchor="middle">Body J1–J5</text>
<rect x="749" y="88" width="415" height="48" rx="12" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="956" y="121" class="heading green" text-anchor="middle">Neck J6–J8</text>
<rect x="36" y="155" width="128" height="127" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="100" y="192" class="code muted" text-anchor="middle">[0]</text>
<text x="100" y="234" class="title" text-anchor="middle">J1</text>
<text x="100" y="265" class="small muted" text-anchor="middle">rad</text>
<rect x="179" y="155" width="128" height="127" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="243" y="192" class="code muted" text-anchor="middle">[1]</text>
<text x="243" y="234" class="title" text-anchor="middle">J2</text>
<text x="243" y="265" class="small muted" text-anchor="middle">rad</text>
<rect x="322" y="155" width="128" height="127" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="386" y="192" class="code muted" text-anchor="middle">[2]</text>
<text x="386" y="234" class="title" text-anchor="middle">J3</text>
<text x="386" y="265" class="small muted" text-anchor="middle">rad</text>
<rect x="465" y="155" width="128" height="127" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="529" y="192" class="code muted" text-anchor="middle">[3]</text>
<text x="529" y="234" class="title" text-anchor="middle">J4</text>
<text x="529" y="265" class="small muted" text-anchor="middle">rad</text>
<rect x="608" y="155" width="128" height="127" rx="12" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="672" y="192" class="code muted" text-anchor="middle">[4]</text>
<text x="672" y="234" class="title" text-anchor="middle">J5</text>
<text x="672" y="265" class="small muted" text-anchor="middle">rad</text>
<rect x="751" y="155" width="128" height="127" rx="12" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="815" y="192" class="code muted" text-anchor="middle">[5]</text>
<text x="815" y="234" class="title" text-anchor="middle">J6</text>
<text x="815" y="265" class="small muted" text-anchor="middle">rad</text>
<rect x="894" y="155" width="128" height="127" rx="12" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="958" y="192" class="code muted" text-anchor="middle">[6]</text>
<text x="958" y="234" class="title" text-anchor="middle">J7</text>
<text x="958" y="265" class="small muted" text-anchor="middle">rad</text>
<rect x="1037" y="155" width="128" height="127" rx="12" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1101" y="192" class="code muted" text-anchor="middle">[7]</text>
<text x="1101" y="234" class="title" text-anchor="middle">J8</text>
<text x="1101" y="265" class="small muted" text-anchor="middle">rad</text>
<text x="36" y="333" class="body" text-anchor="start">JointCommand.position must contain all eight entries.</text>
<text x="36" y="374" class="small muted" text-anchor="start">Leave name, velocity and torque empty. J1 maps to position[0].</text>
</svg>
